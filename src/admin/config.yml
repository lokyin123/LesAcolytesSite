backend:
  name: git-gateway
  branch: main

# Lets the CMS run against local files during development:
#   terminal 1: npm start      terminal 2: npm run cms
# then open http://localhost:8080/admin/ — no login needed locally.
# Ignored entirely on the deployed site, which uses git-gateway above.
# Port 8082 (not decap-server's default 8081) because Eleventy's dev server
# already holds 8081 — see PORT in the .env file at the repo root.
local_backend:
  url: http://localhost:8082/api/v1

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

site_url: https://lesacolytesmusic.netlify.app
# No logo_url: Decap renders it at full size, so the hero photo swamped the
# login screen. Add one here only when there's a proper small logo/wordmark.

# Decap's preview pane renders the content unstyled, which looks broken and
# misleads the editor about how the site will actually appear.
editor:
  preview: false

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General"
        file: "src/_data/settings.yaml"
        fields:
          - { label: "Ensemble Name", name: "ensemble_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", hint: "Shared metadata fallback used when a page does not provide its own summary." }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home"
        file: "src/_data/pages/home.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Discover link label", name: "discover_label", widget: "string" }
          - { label: "Performance heading", name: "performance_heading", widget: "string" }
          - { label: "Performance introduction", name: "performance_intro", widget: "string" }
          - { label: "Performance button", name: "performance_button", widget: "string" }
          - { label: "Fallback heading", name: "fallback_heading", widget: "string" }
          - { label: "Fallback button", name: "fallback_button", widget: "string" }
          - { label: "Fallback empty text", name: "fallback_empty_text", widget: "text" }
          - { label: "Fallback empty button", name: "fallback_empty_button", widget: "string" }
          - { label: "Media invitation heading", name: "media_invitation_heading", widget: "string" }
          - { label: "Media invitation button", name: "media_invitation_button", widget: "string" }
          - { label: "Social heading", name: "social_heading", widget: "string" }
          - { label: "Social introduction", name: "social_intro", widget: "text" }
          - { label: "Contact prompt", name: "social_contact_prompt", widget: "string" }
          - { label: "Contact button", name: "social_contact_button", widget: "string" }
      - name: "about"
        label: "About"
        file: "src/_data/pages/about.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Body heading", name: "content_heading", widget: "string" }
          - { label: "Body text", name: "content_body", widget: "markdown" }
      - name: "musicians"
        label: "Musicians"
        file: "src/_data/pages/musicians.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - label: "Members"
            name: "members"
            label_singular: "member"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Instrument", name: "role", widget: "string" }
              - { label: "Biography", name: "bio", widget: "markdown" }
              - { label: "Biography panel colour", name: "tone", widget: "select", options: ["clay", "sage", "sand", "blue", "rose"] }
              - label: "Portraits"
                name: "images"
                label_singular: "portrait"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Photo", name: "src", widget: "image" }
                  - { label: "Image Description", name: "alt", widget: "string" }
      - name: "whats-on"
        label: "What's On"
        file: "src/_data/pages/whats-on.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Upcoming performances heading", name: "upcoming_heading", widget: "string" }
          - { label: "Past performances heading", name: "past_heading", widget: "string" }
          - { label: "Event details button", name: "details_button", widget: "string" }
          - { label: "Past media eyebrow", name: "past_media_eyebrow", widget: "string" }
          - { label: "Past media heading", name: "past_media_heading", widget: "string" }
          - { label: "Past media text", name: "past_media_text", widget: "text" }
          - { label: "Past media button", name: "past_media_button", widget: "string" }
          - { label: "No upcoming events text", name: "empty_text", widget: "text" }
      - name: "programmes"
        label: "Programmes"
        file: "src/_data/pages/programmes.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Body heading", name: "content_heading", widget: "string" }
          - { label: "Body text", name: "content_body", widget: "markdown" }
      - name: "media"
        label: "Media"
        file: "src/_data/pages/media.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Recordings heading", name: "recordings_heading", widget: "string" }
          - { label: "Gallery eyebrow", name: "gallery_eyebrow", widget: "string" }
          - { label: "Gallery heading", name: "gallery_heading", widget: "string" }
      - name: "news-page"
        label: "News page"
        file: "src/_data/pages/news.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Listing heading", name: "listing_heading", widget: "string" }
          - { label: "Listing introduction", name: "listing_intro", widget: "text" }
      - name: "contact"
        label: "Contact"
        file: "src/_data/pages/contact.yaml"
        fields:
          - { label: "Navigation label", name: "nav_label", widget: "string" }
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Subtitle", name: "summary", widget: "text" }
          - { label: "Hero image", name: "image", widget: "image" }
          - { label: "Bookings heading", name: "heading", widget: "string" }
          - { label: "Bookings body", name: "body", widget: "text" }
          - { label: "Contact email", name: "email", widget: "string" }
          - { label: "Social heading", name: "social_heading", widget: "string" }
          - { label: "Social introduction", name: "social_intro", widget: "text" }
          - label: "Social links"
            name: "social_links"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Key", name: "key", widget: "hidden" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    slug: "{{fields.event_date}}-{{slug}}"
    summary: "{{fields.event_date}} — {{title}}"
    sortable_fields: ["event_date", "title"]
    editor:
      preview: false
    fields:
      # Keeps each event from generating its own page — the events all live on
      # the one scrolling homepage. Not something the editor should change.
      - { label: "Internal setting (leave alone)", name: "permalink", widget: "hidden", default: false }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Festival / Concert Series", name: "series", widget: "string", required: false, hint: "Optional. Leave blank for independent performances." }
      # "datetime", not "date" — Decap 3 removed the standalone date widget,
      # which is why this field previously rendered as "No control for widget".
      - label: "Date"
        name: "event_date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMMM YYYY"
        time_format: false
        picker_utc: true
        hint: "The site shows this as e.g. 12 September 2026, and hides the event automatically once the date has passed."
      - { label: "Time", name: "event_time", widget: "string", required: false, hint: "Use 24-hour time, for example 15:00 or 20:30." }
      - { label: "Past performance", name: "past_performance", widget: "boolean", default: false, required: false, hint: "Turn this on to place the event under Past Performances even if its date has not passed." }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Ticket / Info Link", name: "ticket_url", widget: "string", required: false, hint: "Paste the full web address for tickets or details. Leave blank if there isn't one yet." }
      - { label: "Description", name: "body", widget: "markdown", required: false, hint: "Programme notes, repertoire, anything worth saying about the concert." }

  - name: "news"
    label: "News"
    label_singular: "News article"
    folder: "src/content/news"
    create: true
    slug: "{{fields.news_date}}-{{slug}}"
    summary: "{{fields.news_date}} - {{title}}"
    sortable_fields: ["news_date", "title"]
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Publication Date"
        name: "news_date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD MMMM YYYY"
        time_format: false
        picker_utc: true
      - { label: "Summary", name: "excerpt", widget: "text", hint: "A short introduction shown on the News page and in search descriptions." }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Description", name: "image_alt", widget: "string", required: false, hint: "Describe the image for visitors using screen readers." }
      - { label: "Article", name: "body", widget: "markdown" }

  - name: "media"
    label: "Media"
    files:
      - name: "media"
        label: "Videos & Photos"
        file: "src/_data/media.yaml"
        fields:
          - label: "Videos"
            name: "videos"
            label_singular: "video"
            widget: "list"
            summary: "{{fields.composer}} — {{fields.piece}}"
            fields:
              - { label: "Composer", name: "composer", widget: "string", hint: "For example: François Couperin" }
              - { label: "Piece", name: "piece", widget: "string", hint: "The title of the work or movement." }
              - { label: "YouTube Video ID", name: "youtube_id", widget: "string", hint: "Just the code after 'watch?v=' in the YouTube address — e.g. for youtube.com/watch?v=KMH-7NeWgVA enter KMH-7NeWgVA", required: false }
          - label: "Photos"
            name: "photos"
            label_singular: "photo"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Photo", name: "src", widget: "image" }
              - { label: "Description", name: "alt", widget: "string", hint: "A short description of what's in the photo — read aloud to visually impaired visitors." }
