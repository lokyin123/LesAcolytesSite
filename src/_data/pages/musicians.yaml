    bio: >-
      **Edward Campbell-Rowntree** is a harpsichordist, pianist, and
      musicologist originally from the North East of England, now based at
      Girton College, Cambridge, where he is a PhD candidate in musicology,
      researching French music of the seventeenth and eighteenth centuries,
      funded by the Vice Chancellor’s & Rosalie Crawford Girton PhD Studentship.
      He is a founding member of the chamber ensemble Les Acolytes. 


      Before Cambridge, he studied music at King’s College, London (BMus), the University of Oxford (MSt), and the Royal Northern College of Music, Manchester (MMus, PGDip) where he specialised in piano performance and focused on song repertoire, becoming a member of the RNCM Songsters and winning first prize in the inaugural Williams-Howard Memorial Competition. Since then, he was made a Leeds Lieder Young Artist (2023), a member of the Cambridge University Lieder Scheme (2023-24), and took part in the Wigmore Hall International Song Competition(2024) alongside soprano Georgie Malcolm. 


      Edward is an experienced and passionate educator, regularly supervising Cambridge undergraduates alongside teaching piano and music theory at the Saffron Centre for Young Musicians in Essex. Over the years, Edward has received generous financial support from the Help Musicians UK, Northumberland Estates, the Oglesby Charitable Trust, the Headley Trust,and the Eric Horner Award.
