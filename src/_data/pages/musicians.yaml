    tone: clay
    bio: >-
      **Andrew Taheny** is a violinist originally from Glasgow, who enjoys a
      varied performance schedule using period and modern instruments. He has
      performed with ensembles ranging from the Hanover Band, Irish Baroque
      Orchestra, Manchester Baroque, Instruments of Time & Truth, London Early
      Opera and La Serenissima to the Hallé, Philharmonia, Royal Philharmonic
      Orchestra, Manchester Camerata, BBC Philharmonic and BBC Scottish Symphony
      Orchestra. He also has a passion for chamber music, performing regularly
      with Les Acolytes, the Millbank Quartet and Musica Antica Rotherhithe. He
      has taken part in recordings of repertoire from the 17thto 21st
      centuries. 


      Andrew studied with Ruth Crouch at the University of Edinburgh (BMus) and with Julia Hanson and Pauline Nobes at the Royal Northern College of Music (MMus, PGDip). He has received further tuition from Bojan Čičić, Emmanuel Resche-Caserta, Catherine Martin, Lucy Russell, Rachel Podger, Judy Tarling and Roberto Ruisi. He was a 2023/24 Southbank Sinfonia Violin Fellow and took part in the 2024/25 Hallé Advanced Orchestral String Programme. He is currently taking part in fellowships with the Orchestra of the Age of Enlightenment, the English Concert and Manchester Baroque.


      Andrewis passionate about music education and engagement. Besides his regular peripatetic teaching, he has taken part in outreach projects with the Hallé, Royal Liverpool Philharmonic, Manchester Baroque, Orchestra of the Age of Enlightenment, Southbank Sinfonia, Nevis Ensemble and the Benedetti Foundation. 


      Andrew plays a Dearlove violin (1832) and a J.C. Kloz baroque violin (1756, with bowsby Eitan Hoffer), generously loaned to him by the Tompkins-Tate Trust and Cherubim Music Trust, respectively. He is also grateful to the Cross Trust, McGlashan Trust, Friends of Baroque Music in Yorkshire, Friends of St. Cecilia’s Hall and Edinburgh College of Art for supporting his studies.
